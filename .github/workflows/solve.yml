name: solve
on:
  workflow_dispatch:
concurrency:
  group: relay
  cancel-in-progress: false
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/725ba00e-cft22
          fetch-depth: 0
      - name: deps
        run: |
          python3 -V
          pip install --quiet --disable-pip-version-check web3 eth-account pycryptodome gmpy2 sympy numpy requests
          python3 -c "import web3, eth_account, Crypto, gmpy2, sympy, numpy; print('deps ok')"
      - name: config
        run: |
          git config user.name "relay-bot"
          git config user.email "relay-bot@users.noreply.github.com"
      - name: relay
        run: bash ci/relay.sh
